---
############################################################
# T-Pot - Install recommended, remove conflicting packages #
############################################################

- name: Syncing clocks (All)
  ansible.builtin.command: "hwclock --hctosys"
  when: ansible_facts['distribution'] in tpot_supported_distributions
  failed_when: false
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Install recommended packages (Debian, Raspbian, Ubuntu)
  ansible.builtin.package:
    name:
      - apache2-utils
      - bash-completion
      - ca-certificates
      - cracklib-runtime
      - cron
      - curl
      - git
      - gnupg
      - grc
      - htop
      - micro
      - net-tools
      - vim
      - wget
    state: latest
    update_cache: true
  when: ansible_facts['distribution'] in ["Debian", "Raspbian", "Ubuntu"]
  tags:
    - "Debian"
    - "Raspbian"
    - "Ubuntu"

- name: Install grc from remote repo (AlmaLinux, Rocky)
  ansible.builtin.dnf:
    name: 'https://github.com/kriipke/grc/releases/download/1.13.8/grc-1.13.8-1.el7.noarch.rpm'
    disable_gpg_check: true
    state: present
  when: ansible_facts['distribution'] in ["AlmaLinux", "Rocky"]
  tags:
    - "AlmaLinux"
    - "Rocky"

- name: Install recommended packages (AlmaLinux, Rocky)
  ansible.builtin.package:
    name:
      - bash-completion
      - ca-certificates
      - cracklib
      - curl
      - dnf-plugins-core
      - git
      - grc
      - htop
      - httpd-tools
      - net-tools
      - tar
      - vim
      - wget
    state: latest
    update_cache: true
  when: ansible_facts['distribution'] in ["AlmaLinux", "Rocky"]
  tags:
    - "AlmaLinux"
    - "Rocky"

- name: Download and install micro editor (AlmaLinux, openSUSE Tumbleweed, RHEL, Rocky)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl https://getmic.ro | bash && mv micro /usr/bin
    executable: /bin/bash
  when: ansible_facts['distribution'] in ["AlmaLinux", "openSUSE Tumbleweed", "RedHat", "Rocky"]
  tags:
    - "AlmaLinux"
    - "openSUSE Tumbleweed"
    - "RedHat"
    - "Rocky"

- name: Install recommended packages (Fedora)
  ansible.builtin.package:
    name:
      - bash-completion
      - ca-certificates
      - cracklib
      - cronie
      - curl
      - dnf-plugins-core
      - git
      - grc
      - htop
      - httpd-tools
      - micro
      - net-tools
      - vim
      - wget
    state: latest
    update_cache: true
  when: ansible_facts['distribution'] in ["Fedora"]
  tags:
    - "Fedora"

- name: Remove conflicting packages (openSUSE Tumbleweed)
  ansible.builtin.package:
    name:
      - cups
      - net-tools
      - postfix
      - yast2-auth-client
      - yast2-auth-user
    state: absent
    update_cache: true
  when: ansible_facts['distribution'] in ["openSUSE Tumbleweed"]
  tags:
    - "openSUSE Tumbleweed"

- name: Install recommended packages (openSUSE Tumbleweed)
  ansible.builtin.package:
    name:
      - apache2-utils
      - bash-completion
      - busybox-net-tools
      - ca-certificates
      - cracklib
      - curl
      - git
      - grc
      - htop
      - vim
      - wget
    state: latest
    update_cache: true
  when: ansible_facts['distribution'] in ["openSUSE Tumbleweed"]
  tags:
    - "openSUSE Tumbleweed"
