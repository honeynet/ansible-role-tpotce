---
#################################
# T-Pot - Install Docker Engine #
#################################

- name: Install Docker Engine packages (openSUSE Tumbleweed)
  ansible.builtin.package:
    name:
      - docker
      - docker-bash-completion
      - docker-buildx
      - docker-compose
      - docker-compose-switch
      - liblvm2cmd2_03
      - lvm2
    state: latest
    update_cache: true
  when: ansible_facts['distribution'] in ["openSUSE Tumbleweed"]
  tags:
    - "openSUSE Tumbleweed"

- name: Install Docker Engine packages (AlmaLinux, Debian, Fedora, Raspbian, RHEL, Rocky, Ubuntu)
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    update_cache: true
  when: ansible_facts['distribution'] in ["AlmaLinux", "Debian", "Fedora", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Stop Docker (All)
  ansible.builtin.service:
    name: docker
    state: stopped
    enabled: false
  when: ansible_facts['distribution'] in tpot_supported_distributions
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"
