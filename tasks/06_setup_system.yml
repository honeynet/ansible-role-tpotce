---
######################################################
# T-Pot - Adjust configs, add users and groups, etc. #
######################################################

- name: Create T-Pot group (All)
  ansible.builtin.group:
    name: tpot
    gid: 2000
    state: present
  when: ansible_facts['distribution'] in tpot_supported_distributions
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Create T-Pot user (All)
  ansible.builtin.user:
    name: tpot
    uid: 2000
    system: yes
    shell: /bin/false
    home: /nonexistent
    group: tpot
  when: ansible_facts['distribution'] in tpot_supported_distributions
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Ensure vm.max_map_count is set (All)
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: "vm.max_map_count=262144"
    state: present
    create: true
    mode: '0644'
  when: ansible_facts['distribution'] in tpot_supported_distributions
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

# Containers need IPv4 forwarding. Docker used to enable it itself; with the
# nftables firewall backend it refuses to start instead, so it has to be set
# here -- before 07_restart_services.yml brings Docker up.
- name: Ensure IPv4 forwarding is enabled (All)
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: "net.ipv4.ip_forward=1"
    state: present
    create: true
    mode: '0644'
  when: ansible_facts['distribution'] in tpot_supported_distributions
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

# The line above only takes effect on the next boot, but Docker is started
# later in this same run. `changed_when: false` because the persistent change
# is already reported by the task above; this only makes it live.
- name: Enable IPv4 forwarding now (All)
  ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
  changed_when: false
  when: ansible_facts['distribution'] in tpot_supported_distributions
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Disable ssh.socket unit (Ubuntu)
  ansible.builtin.systemd:
    name: ssh.socket
    state: stopped
    enabled: false
  when: ansible_facts['distribution'] in ["Ubuntu"]
  tags:
    - "Ubuntu"

- name: Remove ssh.socket.conf file (Ubuntu)
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d/00-socket.conf
    state: absent
  when: ansible_facts['distribution'] in ["Ubuntu"]
  tags:
    - "Ubuntu"
  notify: Restart SSH (All)

- name: Comment out Port(s) in sshd_config, can cause port conflicts on deploy (AlmaLinux, Debian, Fedora, openSUSE Tumbleweed, Raspbian, RHEL, Rocky, Ubuntu)
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^(Port (?!64295$)[0-9]+)'
    replace: '# \1'
  when: ansible_facts['distribution'] in tpot_supported_distributions
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"
  notify: Restart SSH (All)

- name: Change SSH Port to 64295 (AlmaLinux, Debian, Fedora, Raspbian, RHEL, Rocky, Ubuntu)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Port 64295"
    insertafter: EOF
  when: ansible_facts['distribution'] in ["AlmaLinux", "Debian", "Fedora", "Raspbian", "RedHat", "Rocky", "Ubuntu"]
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"
  notify: Restart SSH (All)

- name: Change SSH Port to 64295 (openSUSE Tumbleweed)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/port.conf
    line: "Port 64295"
    create: true
    mode: '0600'
  when: ansible_facts['distribution'] in ["openSUSE Tumbleweed"]
  tags:
    - "openSUSE Tumbleweed"
  notify: Restart SSH (All)

- name: Add T-Pot SSH port to Firewall (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)
  ansible.posix.firewalld:
    port: 64295/tcp
    permanent: yes
    state: enabled
  when: ansible_facts['distribution'] in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
  tags:
    - "AlmaLinux"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "RedHat"
    - "Rocky"
  notify: Restart Firewalld (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)

- name: Set T-Pot default target to ACCEPT (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)
  ansible.posix.firewalld:
    zone: public
    target: ACCEPT
    permanent: yes
    state: enabled
  when: ansible_facts['distribution'] in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
  tags:
    - "AlmaLinux"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "RedHat"
    - "Rocky"
  notify: Restart Firewalld (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)

# RHEL 10 and its rebuilds ship a kernel without the legacy xtables modules,
# where `modprobe iptable_filter` is fatal. Those systems provide `iptables` as
# an nftables based frontend instead, which loads nf_tables on its own and
# needs nothing preloaded. `-n` is a dry run: it reports whether the module
# exists without loading it.
- name: Look for the iptable_filter module (AlmaLinux, Fedora, RHEL, Rocky)
  ansible.builtin.command: modprobe -n iptable_filter
  register: tpot_iptable_filter
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
  tags:
    - "AlmaLinux"
    - "Fedora"
    - "RedHat"
    - "Rocky"

- name: Load kernel modules (AlmaLinux, Fedora, RHEL, Rocky)
  ansible.builtin.command: modprobe -v iptable_filter
  changed_when: false
  when:
    - ansible_facts['distribution'] in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
    - tpot_iptable_filter.rc | default(1) == 0
  tags:
    - "AlmaLinux"
    - "Fedora"
    - "RedHat"
    - "Rocky"

# Only where the module exists: systemd-modules-load logs a failure on every
# boot for each entry it cannot find.
- name: Update iptables.conf (AlmaLinux, Fedora, RHEL, Rocky)
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/iptables.conf
    line: iptable_filter
    create: true
    mode: '0644'
  when:
    - ansible_facts['distribution'] in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
    - tpot_iptable_filter.rc | default(1) == 0
  tags:
    - "AlmaLinux"
    - "Fedora"
    - "RedHat"
    - "Rocky"

##############################################################################
# Docker on kernels without the xtables extensions
#
# Docker's iptables backend needs them. RHEL 10 and its rebuilds ship a kernel
# without, and dockerd then aborts with "Extension addrtype revision 0 not
# supported, missing kernel module?" and cannot create its bridge network.
# Docker Engine 28 and later can drive nftables directly instead.
#
# Note: `modprobe -n` asks the running kernel, so in a container this reports
# on the *host* kernel. The whole block is therefore skipped in the container
# based molecule scenario, and is covered by the `full` scenario on an EL10 VM.
##############################################################################

- name: Look for the xt_addrtype module (All)
  ansible.builtin.command: modprobe -n xt_addrtype
  register: tpot_xt_addrtype
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] in tpot_supported_distributions
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Look for the nftables firewall backend in dockerd (All, kernels without xtables)
  ansible.builtin.command: dockerd --help
  register: tpot_dockerd_help
  changed_when: false
  failed_when: false
  when: tpot_xt_addrtype.rc | default(0) != 0
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Abort if Docker cannot manage the firewall on this kernel (All, kernels without xtables)
  ansible.builtin.assert:
    that: "'--firewall-backend' in tpot_dockerd_help.stdout | default('')"
    fail_msg: >-
      This kernel ships no xtables modules, so Docker cannot use its iptables
      firewall backend, and this Docker Engine does not offer the nftables
      backend either. A newer Docker Engine is required.
    success_msg: "Docker will manage the firewall through nftables."
  when: tpot_xt_addrtype.rc | default(0) != 0
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Create the Docker configuration directory (All, kernels without xtables)
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: tpot_xt_addrtype.rc | default(0) != 0
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Look for an existing Docker configuration (All, kernels without xtables)
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: tpot_docker_json
  when: tpot_xt_addrtype.rc | default(0) != 0
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Read an existing Docker configuration (All, kernels without xtables)
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: tpot_docker_json_content
  when: tpot_docker_json.stat.exists | default(false)
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

# Merged into any existing daemon.json so hand made settings survive.
- name: Switch Docker to the nftables firewall backend (All, kernels without xtables)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ tpot_docker_config | combine({'firewall-backend': 'nftables'}) | to_nice_json }}\n"
    owner: root
    group: root
    mode: '0644'
  vars:
    tpot_docker_config: >-
      {{ (tpot_docker_json_content.content | b64decode | from_json)
         if tpot_docker_json.stat.exists | default(false) else {} }}
  when: tpot_xt_addrtype.rc | default(0) != 0
  notify: Restart Docker (All)
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

# Guarded on the SELinux fact rather than run unconditionally: where SELinux
# is disabled there is no /etc/selinux/config to edit and nothing to relax, and
# `setenforce` exits 1 with "SELinux is disabled", which would abort the run.
- name: Set SELinux config to permissive (AlmaLinux, Fedora, RHEL, Rocky)
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=permissive'
  when:
    - ansible_facts['distribution'] in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
    - ansible_facts['selinux'].status | default('disabled') != 'disabled'
  tags:
    - "AlmaLinux"
    - "Fedora"
    - "RedHat"
    - "Rocky"

- name: Set SELinux to permissive (AlmaLinux, Fedora, RHEL, Rocky)
  ansible.builtin.command: "setenforce Permissive"
  when:
    - ansible_facts['distribution'] in ["AlmaLinux", "Fedora", "RedHat", "Rocky"]
    - ansible_facts['selinux'].status | default('disabled') != 'disabled'
  tags:
    - "AlmaLinux"
    - "Fedora"
    - "RedHat"
    - "Rocky"

- name: Stop Resolved (Fedora, RHEL, Ubuntu)
  ansible.builtin.service:
    name: systemd-resolved
    state: stopped
  when: ansible_facts['distribution'] in ["Fedora", "RedHat", "Ubuntu"]
  tags:
    - "Fedora"
    - "RedHat"
    - "Ubuntu"

- name: Copy resolved.conf to /etc/systemd (Fedora)
  ansible.builtin.copy:
    src: /usr/lib/systemd/resolved.conf
    dest: /etc/systemd/resolved.conf
    remote_src: true
    mode: '0644'
  when: ansible_facts['distribution'] in ["Fedora"]
  failed_when: false
  tags:
    - "Fedora"

- name: Copy resolv.conf to /etc/systemd (RHEL)
  ansible.builtin.copy:
    src: /usr/lib/systemd/resolv.conf
    dest: /etc/systemd/resolv.conf
    remote_src: true
    mode: '0644'
  when: ansible_facts['distribution'] in ["RedHat"]
  failed_when: false
  tags:
    - "RedHat"

- name: Modify DNSStubListener in resolved.conf (Fedora, Ubuntu)
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^.*DNSStubListener=.*'
    line: 'DNSStubListener=no'
    state: present
  when: ansible_facts['distribution'] in ["Fedora", "Ubuntu"]
  tags:
    - "Fedora"
    - "Ubuntu"
