---
# The task order below mirrors the play order of the upstream installer,
# telekom-security/tpotce -> installer/install/tpot.yml, followed by the
# post-playbook steps that upstream's install.sh performs.
#
# Note: unlike upstream, this role does not refuse to run as root.

- name: Bootstrap Python
  ansible.builtin.include_tasks: 01_bootstrap_python.yml

- name: Support Check
  ansible.builtin.include_tasks: 02_support_check.yml

# Package lists and repository URLs are kept out of the tasks. Matching on the
# distribution first lets AlmaLinux, Fedora, RHEL and Rocky each keep their own
# list while Debian / Raspbian / Ubuntu and openSUSE fall back to their family.
- name: Load distribution specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Prep System
  ansible.builtin.include_tasks: 03_prep_system.yml

- name: Prep for Docker
  ansible.builtin.include_tasks: 04_prep_for_docker.yml

- name: Install Docker
  ansible.builtin.include_tasks: 05_install_docker.yml

# Creates the tpot group, so it must run before 08_config_system.yml adds
# the current user to it.
- name: Setup System
  ansible.builtin.include_tasks: 06_setup_system.yml

- name: Restart Services
  ansible.builtin.include_tasks: 07_restart_services.yml

# Clones the T-Pot repository, so it must run before anything that reads
# from or writes into it.
- name: Config System
  ansible.builtin.include_tasks: 08_config_system.yml

- name: Setup tpot
  ansible.builtin.include_tasks: 09_setup_tpot.yml

- name: Config T-Pot
  ansible.builtin.include_tasks: 10_config_tpot.yml

- name: Build Compose
  ansible.builtin.include_tasks: 11_build_compose.yml

- name: Pull Images
  ansible.builtin.include_tasks: 12_pull_images.yml
  when: tpot_pull_images | bool

- name: Daily Reboot
  ansible.builtin.include_tasks: 13_daily_reboot.yml
  when: tpot_daily_reboot | bool

# Reads upstream's word lists out of the clone, so it has to run after
# 08_config_system.yml. Nothing in the role depends on the host name, and
# tpot.service is only enabled, never started, so the rename still lands
# before a single honeypot has run.
- name: Set Hostname
  ansible.builtin.include_tasks: 14_set_hostname.yml
  when: tpot_set_hostname | bool
