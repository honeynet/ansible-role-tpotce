---
name: CI

'on':
  pull_request:
  push:
    branches:
      - master
      - full-rework
  schedule:
    # Upstream's service catalogue is read at run time, so a weekly run catches
    # changes to it (new honeypots, renamed services, changed ports).
    - cron: '0 5 * * 1'

defaults:
  run:
    working-directory: 'ansible-role-tpotce'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v7
        with:
          path: 'ansible-role-tpotce'

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip3 install ansible-lint yamllint

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible
        run: ansible-lint

  # The matrix is the current release of each distribution T-Pot supports, and
  # nothing older: upstream's installer asserts the distribution version and
  # refuses anything else, so an older release would not be a supported
  # configuration to begin with.
  #
  # geerlingguy publishes an Ansible ready image for Debian, Ubuntu, Rocky and
  # Fedora. AlmaLinux and openSUSE Tumbleweed have none, so they start from the
  # distribution's own image and molecule/default/Dockerfile.j2 adds systemd,
  # python3 and sudo. RHEL and Raspbian have no usable public image at all and
  # stay covered by the `full` scenario on a virtual machine.
  #
  # These containers share the runner's kernel, which has the full xtables
  # module set. `modprobe -n xt_addrtype` therefore succeeds on every distro
  # here, so the nftables fallback in 06_setup_system.yml is never taken in
  # this job -- what it does prove is that the probes are harmless on a kernel
  # that does have the modules. The fallback itself needs the `full` scenario
  # on an EL10 VM.
  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    # Six containers is a lot of runner time to spend on a branch that does not
    # even lint, and a lint failure is the fastest thing to fix, so gate on it.
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian13
            image: geerlingguy/docker-debian13-ansible:latest
            command: /lib/systemd/systemd
          - distro: ubuntu2604
            image: geerlingguy/docker-ubuntu2604-ansible:latest
            command: /lib/systemd/systemd
          - distro: almalinux10
            image: almalinux:10
            command: /usr/lib/systemd/systemd
          - distro: rockylinux10
            image: geerlingguy/docker-rockylinux10-ansible:latest
            command: /usr/lib/systemd/systemd
          - distro: fedora44
            image: geerlingguy/docker-fedora44-ansible:latest
            command: /usr/lib/systemd/systemd
          - distro: tumbleweed
            image: opensuse/tumbleweed:latest
            command: /usr/lib/systemd/systemd

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v7
        with:
          path: 'ansible-role-tpotce'

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip3 install -r requirements.txt

      # requirements.txt installs ansible-core, which ships no collections. The
      # molecule docker driver needs community.docker before it can create a
      # container, and the role itself needs ansible.posix.
      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule tests
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_IMAGE: ${{ matrix.image }}
          MOLECULE_DISTRO_TAG: ${{ matrix.distro }}
          MOLECULE_DOCKER_COMMAND: ${{ matrix.command }}
