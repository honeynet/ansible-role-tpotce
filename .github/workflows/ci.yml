---
name: CI

'on':
  pull_request:
  push:
    branches:
      - master
      - full-rework
  schedule:
    # Upstream's service catalogue is read at run time, so a weekly run catches
    # changes to it (new honeypots, renamed services, changed ports).
    - cron: '0 5 * * 1'

defaults:
  run:
    working-directory: 'ansible-role-tpotce'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4
        with:
          path: 'ansible-role-tpotce'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip3 install ansible-lint yamllint

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible
        run: ansible-lint

  # AlmaLinux and openSUSE have no geerlingguy image, so they stay covered by
  # the `full` scenario on a virtual machine.
  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian12
            command: /lib/systemd/systemd
          - distro: debian13
            command: /lib/systemd/systemd
          - distro: ubuntu2404
            command: /lib/systemd/systemd
          - distro: rockylinux9
            command: /usr/lib/systemd/systemd
          - distro: fedora42
            command: /usr/lib/systemd/systemd

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4
        with:
          path: 'ansible-role-tpotce'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip3 install -r requirements.txt

      # requirements.txt installs ansible-core, which ships no collections. The
      # molecule docker driver needs community.docker before it can create a
      # container, and the role itself needs ansible.posix.
      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule tests
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          MOLECULE_DISTRO_TAG: ${{ matrix.distro }}
          MOLECULE_DOCKER_COMMAND: ${{ matrix.command }}
