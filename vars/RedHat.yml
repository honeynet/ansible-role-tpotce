---
# Red Hat Enterprise Linux. Upstream installs no recommended package set here,
# it only adds the micro editor from source.

tpot_recommended_packages: []

tpot_conflicting_packages: []

tpot_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

tpot_docker_repo_url: "https://download.docker.com/linux/rhel/docker-ce.repo"

tpot_install_micro_from_source: true

# Provides crontab, which the daily reboot job needs.
tpot_cron_package: cronie
