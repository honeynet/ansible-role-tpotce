---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  vars:
    tpot_dir: /opt/tpotce

  tasks:

    ##########################################################################
    # System state
    ##########################################################################

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Docker Engine is installed and enabled
      ansible.builtin.assert:
        that: ansible_facts.services['docker.service'].status == 'enabled'
        fail_msg: "docker.service is not enabled"

    - name: The tpot group exists
      ansible.builtin.getent:
        database: group
        key: tpot

    - name: The tpot user exists
      ansible.builtin.getent:
        database: passwd
        key: tpot

    - name: The tpot systemd unit was installed
      ansible.builtin.slurp:
        src: /etc/systemd/system/tpot.service
      register: tpot_unit

    - name: Assert the tpot unit points at the generated compose file
      ansible.builtin.assert:
        that: tpot_dir ~ '/docker-compose.yml' in (tpot_unit.content | b64decode)
        fail_msg: "tpot.service does not reference {{ tpot_dir }}/docker-compose.yml"

    - name: IPv4 forwarding is persisted
      ansible.builtin.slurp:
        src: /etc/sysctl.conf
      register: sysctl_conf

    - name: Assert IPv4 forwarding was written to sysctl.conf
      ansible.builtin.assert:
        that: "'net.ipv4.ip_forward=1' in (sysctl_conf.content | b64decode)"
        fail_msg: "net.ipv4.ip_forward=1 is missing from /etc/sysctl.conf"

    - name: IPv4 forwarding is live
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      changed_when: false
      register: ip_forward

    - name: Assert IPv4 forwarding is enabled now
      ansible.builtin.assert:
        that: ip_forward.stdout | trim == '1'
        fail_msg: "IPv4 forwarding is not enabled, Docker would refuse to start"

    # `sshd -T` reads the compiled in default path, /etc/ssh/sshd_config.
    # openSUSE ships no such file -- its vendor configuration lives in
    # /usr/etc/ssh/sshd_config -- so the bare command reports nothing at all
    # there and has to be pointed at the file the daemon itself uses. That
    # vendor file carries `Include /etc/ssh/sshd_config.d/*.conf`, which is
    # how the role's port.conf takes effect.
    - name: Look for the main sshd configuration file
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: sshd_main

    - name: SSH is configured for port 64295
      ansible.builtin.command: >-
        sshd -T {{ '' if sshd_main.stat.exists else '-f /usr/etc/ssh/sshd_config' }}
      changed_when: false
      # Reported by the assertion below instead of aborting here, so a failure
      # shows what sshd said rather than only that the task exited non-zero.
      failed_when: false
      register: sshd_config

    # Where sshd reads its configuration from is not the same on every
    # distribution -- openSUSE keeps the vendor file in /usr/etc and ships no
    # /etc/ssh/sshd_config -- so when the port assertion fails, report what
    # sshd actually saw rather than only that it disagreed.
    - name: Collect the sshd configuration layout
      ansible.builtin.shell: |
        echo "--- files ---"
        ls -l /etc/ssh/sshd_config /usr/etc/ssh/sshd_config 2>&1
        ls -l /etc/ssh/sshd_config.d/ 2>&1
        echo "--- Include directives ---"
        grep -rIn '^[[:space:]]*Include' /etc/ssh /usr/etc/ssh 2>/dev/null
      changed_when: false
      failed_when: false
      register: sshd_layout

    - name: Locate the sshd binary
      ansible.builtin.shell: command -v sshd || echo 'not on PATH'
      changed_when: false
      failed_when: false
      register: sshd_which

    - name: Assert the SSH port was changed
      ansible.builtin.assert:
        # openSUSE's sshd renders the keyword as `Port`, every other
        # distribution as `port`, so the comparison has to be case folded.
        that: "'port 64295' in sshd_config.stdout | lower"
        fail_msg: |
          sshd is not configured for port 64295.
          command: {{ sshd_config.cmd }}
          rc: {{ sshd_config.rc }}
          stdout lines: {{ sshd_config.stdout_lines | length }}
          port lines: {{ sshd_config.stdout_lines | select('match', '^[Pp]ort ') | list }}
          stderr: {{ sshd_config.stderr | default('') }}
          which sshd: {{ sshd_which.stdout | default('not found') }}
          {{ sshd_layout.stdout }}

    - name: The nightly reboot cron job was installed
      ansible.builtin.command: crontab -l -u root
      changed_when: false
      register: root_crontab

    - name: Assert the reboot job exists
      ansible.builtin.assert:
        that: "'T-Pot Daily Reboot' in root_crontab.stdout"
        fail_msg: "the daily reboot cron job is missing"

    ##########################################################################
    # T-Pot configuration
    ##########################################################################

    - name: Read the T-Pot config file
      ansible.builtin.slurp:
        src: "{{ tpot_dir }}/.env"
      register: env_raw

    - name: The sensor keys were written to .env
      ansible.builtin.assert:
        that:
          - "'TPOT_TYPE=SENSOR' in env_content"
          - "'WEB_USER=' in env_content"
        fail_msg: ".env was not configured for a sensor"
      vars:
        env_content: "{{ env_raw.content | b64decode }}"

    - name: The elk_environment placeholder exists so compose can parse env_file
      ansible.builtin.stat:
        path: "{{ tpot_dir }}/data/tpot/etc/compose/elk_environment"
      register: elk_env

    - name: Assert the elk_environment placeholder was created
      ansible.builtin.assert:
        that: elk_env.stat.exists
        fail_msg: "elk_environment placeholder is missing, first compose up would fail"

    ##########################################################################
    # Generated docker-compose.yml
    ##########################################################################

    - name: Read the generated docker-compose.yml
      ansible.builtin.slurp:
        src: "{{ tpot_dir }}/docker-compose.yml"
      register: compose_raw

    - name: Parse the generated docker-compose.yml
      ansible.builtin.set_fact:
        compose: "{{ compose_raw.content | b64decode | from_yaml }}"

    - name: The requested honeypots are present
      ansible.builtin.assert:
        that: item in compose.services
        fail_msg: "{{ item }} is missing from docker-compose.yml"
      loop:
        - tpotinit
        - cowrie
        - dionaea
        - heralding
        - suricata
        - honeytrap
        - filebeat

    - name: Selecting snare pulls in the whole Snare / Tanner group
      ansible.builtin.assert:
        that: item in compose.services
        fail_msg: "{{ item }} should have been added alongside snare"
      loop:
        - snare
        - tanner
        - tanner_api
        - tanner_phpox
        - tanner_redis

    - name: Glutton loses to honeytrap
      ansible.builtin.assert:
        that: "'glutton' not in compose.services"
        fail_msg: "glutton must not run alongside honeytrap"

    - name: The web UI and ELK stack are never generated
      ansible.builtin.assert:
        that: item not in compose.services
        fail_msg: "{{ item }} must never appear in a sensor configuration"
      loop:
        - elasticsearch
        - kibana
        - logstash
        - map_data
        - map_redis
        - map_web
        - nginx
        - spiderfoot

    - name: Only networks that are actually used are declared
      ansible.builtin.assert:
        that: compose.networks | default({}) | list | symmetric_difference(used_networks) | length == 0
        fail_msg: >-
          Declared networks {{ compose.networks | default({}) | list }}
          do not match the networks in use {{ used_networks }}
      vars:
        used_networks: >-
          {%- set nets = [] -%}
          {%- for service in compose.services.values() -%}
            {%- for network in service.networks | default([]) -%}
              {%- set _ = nets.append(network) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ nets | unique | list }}

    - name: No two services publish the same host port
      ansible.builtin.assert:
        that: bindings | length == bindings | unique | length
        fail_msg: "Duplicate host port bindings: {{ bindings }}"
      vars:
        bindings: >-
          {%- set out = [] -%}
          {%- for service in compose.services.values() -%}
            {%- for entry in service.ports | default([]) -%}
              {%- set spec = entry | string -%}
              {%- set mapping = spec.split('/')[0].split(':') -%}
              {%- if mapping | length > 1 -%}
                {%- set _ = out.append(mapping[-2] ~ '/' ~ (spec.split('/')[1] if '/' in spec else 'tcp')) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: Filebeat is wired up for T-Pot 24.04 paths
      ansible.builtin.assert:
        that:
          - "'${TPOT_DATA_PATH}:/data:ro' in compose.services.filebeat.volumes"
          - "'${TPOT_DATA_PATH}/tpot/etc/compose/elk_environment' in compose.services.filebeat.env_file"
        fail_msg: "filebeat is not using the 24.04 data paths"

    - name: Docker accepts the generated compose file
      ansible.builtin.command: docker compose -f docker-compose.yml config --quiet
      args:
        chdir: "{{ tpot_dir }}"
      changed_when: false
