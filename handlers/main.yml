---

- name: Restart Firewalld (AlmaLinux, Fedora, openSUSE Tumbleweed, RHEL, Rocky)
  ansible.builtin.service:
    name: firewalld
    state: restarted
  when: ansible_facts['distribution'] in ["AlmaLinux", "Fedora", "openSUSE Tumbleweed", "RedHat", "Rocky"]
  tags:
    - "AlmaLinux"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "RedHat"
    - "Rocky"

- name: Restart SSH (All)
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts['distribution'] in ['Ubuntu'] else 'sshd' }}"
    state: restarted
    enabled: true
  when: ansible_facts['distribution'] in tpot_supported_distributions
  tags:
    - "AlmaLinux"
    - "Debian"
    - "Fedora"
    - "openSUSE Tumbleweed"
    - "Raspbian"
    - "RedHat"
    - "Rocky"
    - "Ubuntu"

- name: Reload systemd and enable T-Pot service
  become: true
  ansible.builtin.systemd:
    name: tpot.service
    daemon_reload: true
    state: stopped
    enabled: true
  when: ansible_facts['distribution'] in tpot_supported_distributions

# Only notified when /etc/docker/daemon.json is rewritten to switch the
# firewall backend. 07_restart_services.yml flushes handlers before it ensures
# Docker is running, so on a first install this simply starts the service that
# 05_install_docker.yml stopped; on a re-run it picks the new backend up.
- name: Restart Docker (All)
  ansible.builtin.service:
    name: docker
    state: restarted
  when: ansible_facts['distribution'] in tpot_supported_distributions
